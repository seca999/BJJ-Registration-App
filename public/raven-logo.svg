    <!-- Distressed Wing & Flank Feathers -->
    <path d="M285,210 C292,240 298,275 300,310 C302,345 299,380 292,415 C288,435 283,455 278,470 C276,475 274,460 276,445 C282,415 288,380 290,345 C292,310 288,275 282,245 C280,230 282,215 285,210 Z" />
    <path d="M305,240 C312,270 315,305 314,340 C313,375 307,410 298,442 C295,452 292,440 294,430 C301,400 306,368 307,335 C308,302 305,270 298,245 Z" />

    <!-- Ink Splash and Tapering Tail Feathers -->
    <path d="M260,350 C262,380 263,410 262,438 C261,452 258,460 256,455 C255,445 256,425 257,400 C258,375 259,355 260,350 Z" />
    <path d="M245,320 C246,350 247,380 245,405 C244,415 241,420 240,412 C240,395 241,370 242,345 C243,330 244,320 245,320 Z" />
    <path d="M275,440 L278,485 L273,480 L271,445 Z" />
    <path d="M282,430 L286,478 L283,485 L280,440 Z" />
    <path d="M288,410 L292,460 L289,468 L286,420 Z" />
    <path d="M268,430 L270,470 L266,465 L265,435 Z" />

