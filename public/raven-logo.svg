    <path d="M185,190 C182,215 180,245 182,275 C184,295 188,320 188,340 C187,352 184,345 182,330 C178,305 175,275 176,245 C177,220 181,195 185,190 Z" />
    <path d="M198,210 C196,240 195,275 197,310 C198,335 200,360 200,380 C198,390 195,378 194,360 C192,330 191,295 193,260 C194,235 196,215 198,210 Z" />

