    <!-- Splatter & Ink Bristle Specks -->
    <circle cx="130" cy="180" r="2.5" opacity="0.7" />
    <circle cx="145" cy="205" r="2" opacity="0.6" />
    <circle cx="158" cy="245" r="2.2" opacity="0.6" />
    <circle cx="282" cy="492" r="2" opacity="0.5" />
    <circle cx="275" cy="498" r="1.5" opacity="0.5" />
