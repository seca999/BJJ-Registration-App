<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter for ink-bleed / dry-brush edge texture -->
    <filter id="ink-texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <radialGradient id="raven-badge-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="92%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
  </defs>

  <!-- Clean background badge circle -->
  <circle cx="250" cy="250" r="235" fill="url(#raven-badge-bg)" stroke="#09090b" stroke-width="8" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

