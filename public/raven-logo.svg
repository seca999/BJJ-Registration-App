      <path d="M245,195 C250,220 255,248 258,275 C258,278 256,278 255,275 C252,248 247,220 243,195 Z" />
      <path d="M265,220 C270,250 274,280 275,310 C275,312 273,312 272,310 C271,280 267,250 262,220 Z" />
      <path d="M278,260 C282,290 284,320 284,348 C284,350 282,350 282,348 C281,320 279,290 275,260 Z" />
